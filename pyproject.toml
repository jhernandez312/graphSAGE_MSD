[project]
name = "graphsage-msd"
version = "0.1.0"
description = "Room classification on floor plan graphs using graph neural networks"
readme = "README.md"
requires-python = "==3.9.*"
dependencies = [
    "matplotlib==3.9.4",
    "networkx==3.2.1",
    "numpy==1.26.4",
    "pyemd==1.0.0",
    "pyg-lib==0.4.0+pt28cu128",
    "pyyaml==6.0.3",
    "scipy==1.13.1",
    "setuptools==58.1.0",
    "tensorboard==2.20.0",
    "torch==2.8.0",
    "torch-cluster==1.6.3+pt28cu128",
    "torch-geometric==2.6.1",
    "torch-scatter==2.1.2+pt28cu128",
    "torch-sparse==0.6.18+pt28cu128",
    "torch-spline-conv==1.2.2+pt28cu128",
    "tqdm==4.67.3",
]

[tool.uv]
package = false
python-preference = "only-system"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
pyg-lib = { index = "pyg-cu128" }
torch-cluster = { index = "pyg-cu128" }
torch-scatter = { index = "pyg-cu128" }
torch-sparse = { index = "pyg-cu128" }
torch-spline-conv = { index = "pyg-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pyg-cu128"
url = "https://data.pyg.org/whl/torch-2.8.0+cu128.html"
format = "flat"
explicit = true
